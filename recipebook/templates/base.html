<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <header>
            <h1>Recipe Book</h1>
            <nav>
                {% if user.is_authenticated %}
                    <a href="{% url 'logout' %}">Log out</a>
                {% else %}
                    <a href="{% url 'login' %}">Log in</a>
                {% endif %}
            </nav>
        </header>
        <main>
            <h2><u>{% block title %}{% endblock %}</u></h2>
            {% block content %}{% endblock %}
        </main>

    </body>
</html>
