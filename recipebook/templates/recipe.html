<html lang="en-US">
<head>
    <title>Task List</title>
</head>
<body>
    <h1>Recipe Book</h1>
    <ul>
        <h3>{{recipe.name}}</h3>
        <span>Ingredients:</span><br>
        <ul>
            {% for ingredient in recipe.ingredients.all %}
                <li>{{ ingredient.quantity }} {{ ingredient.ingredient.name }}</li>
            {% endfor %}
        </ul>
    </ul>
</body>
</html>
