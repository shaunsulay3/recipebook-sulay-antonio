{% extends "base.html" %}

{% block title %} Recipes List {% endblock %}

{% block content %}
    <a href="{% url 'ledger:add_recipe' %}">add Recipe</a>
    <ul>
        {% for recipe in recipes %}
            <li>
                <a href="{{recipe.get_absolute_url}}">{{ recipe.name }}</a>
                by {{ recipe.author}}
            </li>
        {% endfor %}
        
    </ul>
{% endblock %}
